name: HiveBox CI

on:
  push:
    branches: [ "main", "feat-*" ]
  pull_request:
    branches: [ "main" ]

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint pytest requests-mock
          pip install -r requirements.txt
      - name: Analysing the code with pylint
        run: |
          pylint $(git ls-files '*.py') --disable=C0114,C0115,C0116,W0621

  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v3
      - run: semgrep scan --config=auto

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests-mock
          pip install -r requirements.txt
      - name: Test with pytest
        env:
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          pytest

  security_scan:
    name: Scorecard supply-chain security
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v3
        with:
          persist-credentials: false
      - name: "Run analysis"
        uses: ossf/scorecard-action@v2.3.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  build:
    needs: [test, lint, semgrep]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repo Name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Tag Docker Image
        run: |
          docker build . --tag ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}
          docker build . --tag ghcr.io/${{ env.REPO_LC }}:latest

      - name: Run Container for Testing
        run: docker run -d -p 5000:5000 --name hivebox-ci ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}

      - name: Wait for App to Start
        run: sleep 5

      - name: Test Endpoint (Integration)
        run: |
          response=$(curl -s http://localhost:5000/version)
          echo "Response: $response"
          if [[ "$response" != *'"version":"v0.0.2"'* ]]; then
            echo "Integration Test Failed!"
            exit 1
          fi
          echo "Integration Test Passed!"

      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_LC }}:latest

      - name: Update Kubernetes Manifest
        run: |
          NEW_IMAGE="ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}"
          echo "Updating manifest to use image: $NEW_IMAGE"
          sed -i "s|image: ghcr.io/${{ env.REPO_LC }}:.*|image: $NEW_IMAGE|g" k8s/main.yaml
          cat k8s/main.yaml | grep "image:"

      - name: Commit and Push Manifest changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore(gitops): update k8s manifest with image ${{ github.sha }}"
          branch: ${{ github.ref_name }}
