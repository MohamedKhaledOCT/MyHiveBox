name: HiveBox CI

on:
  push:
    branches: [ "main", "feat-*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write
  actions: read
  id-token: write
  packages: write

jobs:
  # 1. فحص جودة الكود
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      
      # 👇 إصلاح 1: تثبيت كل المكتبات لكي لا يشتكي اللينتر من Import Error
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint pytest requests-mock
          pip install -r requirements.txt
      
      # 👇 إصلاح 2: إضافة W0621 لقائمة التجاهل
      - name: Analysing the code with pylint
        run: |
          pylint $(git ls-files '*.py') --disable=C0114,C0115,C0116,W0621

  # 2. فحص الثغرات (Semgrep)
  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v3
      - run: semgrep scan --config=auto

  # 3. اختبارات الوحدة
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      
      # 👇 إصلاح 3: التأكد من تثبيت pytest يدوياً لتجنب Command not found
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests-mock
          pip install -r requirements.txt
      
      - name: Test with pytest
        env:
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          pytest

  # 4. فحص أمان المستودع
  security_scan:
    name: Scorecard supply-chain security
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v3
        with:
          persist-credentials: false
      - name: "Run analysis"
        uses: ossf/scorecard-action@v2.3.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  # 5. البناء والنشر
  build:
    needs: [test, lint, semgrep]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 
    steps:
      - uses: actions/checkout@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repo Name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Tag Docker Image
        run: |
          docker build . --tag ghcr.io/${{ env.REPO_LC }}/hivebox:${{ github.sha }}
          docker build . --tag ghcr.io/${{ env.REPO_LC }}/hivebox:latest

      - name: Run Container for Testing
        run: docker run -d -p 5000:5000 --name hivebox-ci ghcr.io/${{ env.REPO_LC }}/hivebox:${{ github.sha }}
        
      - name: Wait for App to Start
        run: sleep 5
        
      - name: Test Endpoint (Integration)
        run: |
          response=$(curl -s http://localhost:5000/version)
          echo "Response: $response"
          if [[ "$response" != *'"version":"v0.0.2"'* ]]; then
            echo "Integration Test Failed!"
            exit 1
          fi
          echo "Integration Test Passed!"

      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ env.REPO_LC }}/hivebox:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_LC }}/hivebox:latest
