apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hivebox-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MohamedKhaledOCT/MyHiveBox.git
    targetRevision: feat/phase6-optimization
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
